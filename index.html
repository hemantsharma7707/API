<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API FETCH</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background:radial-gradient(circle at 10% 20%, rgba(255, 180, 80, 0.12), transparent 25%),
            radial-gradient(circle at 90% 80%, rgba(120, 180, 100, 0.12), transparent 25%),#fffaf0;
        }
        .container{
            width: 1000px;
            padding: 20px;
            margin: 50px auto;
            display: grid;
            grid-template-columns: repeat(4,220px);
            justify-content: space-evenly;
            gap: 20px;
        }
        .card img{
            width: 100%;
            margin-bottom: 20px;
            cursor: pointer;
            transition-duration: 300ms;
            border-radius: 20px;
            /* box-shadow: rgba(0, 0, 0, 0.16) 0px 10px 36px 0px, rgba(0, 0, 0, 0.06) 0px 0px 0px 1px; */
            box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px, rgb(51, 51, 51) 0px 0px 0px 3px;
        }
        .card img:hover{
            transform: scale(1.1);
        }
        .title{
            display: flex;
            justify-content: space-between;
        }
        .title h5{
            margin-top: 10px;
        }
        button{
            margin-top: 10px;
            padding: 3px 8px;
            border: none;
            background-color: black;
            color: white;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            border-radius: 10px;
            cursor: pointer;
        }
        h1{
            text-align: center;
            margin-top: 50px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 50px;
        }
    </style>
</head>
<body>
        <h1>Recipes 🔥🍛</h1>
    <div class="container"></div>

    <script>
        const container = document.querySelector(".container")
        async function apihandler (){
            const response = await fetch("https://dummyjson.com/recipes");
            const data = await response.json()
            for ( let recipes of data.recipes){
                const div = document.createElement("div")
                div.classList.add("card")
                div.innerHTML=`<img src=${recipes.image}
            <div class="title">
                <h5>${recipes.name}</h5>
                <button>View</button>
                </div>`
                container.append(div)                
            }
        }
        apihandler()
    </script>
</body>
</html>
